sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 123456
  alioss:
      endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
      bucket-name: ${ALIOSS_BUCKET_NAME:your-bucket-name}
      access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}

  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 10

  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
    mchid: ${WECHAT_MCHID}
    mchSerialNo: ${WECHAT_MCHSERIALNO}
    privateKeyFilePath: ${WECHAT_PRIVATEKEYFILEPATH}
    apiV3Key: ${WECHAT_APIV3KEY}
    weChatPayCertFilePath: ${WECHAT_WECHATPAYCERTFILEPATH}
    notifyUrl: ${NOTIFYURL}
    refundNotifyUrl: ${REFUNDNOTIFYURL}

spring:
  config:
    import: optional:classpath:application-local.yml


